name: pull-request-validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: account-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run test:mutation
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
